<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica & Básica - Calcula Tudo Box</title>
    
    <!-- Configurações de PWA e Tema -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker registrado com sucesso!'))
          .catch((err) => console.log('Erro ao registrar Service Worker:', err));
      }
    </script>

    <!-- Estilos Nativos (Padrão do Portal - Sem dependência externa) -->
    <style>
        :root { 
            --bg: #020617; 
            --card: #0f172a; 
            --hover: #1e293b; 
            --border: #1e293b; 
            --text: #f8fafc; 
            --muted: #94a3b8; 
            --blue: #3b82f6; 
            --cyan: #22d3ee;
            --rose: #f43f5e;
        }
        body.light { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --hover: #f1f5f9; 
            --border: #e2e8f0; 
            --text: #0f172a; 
            --muted: #475569; 
            --cyan: #0284c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: 0.2s; }
        header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 1.3rem; }
        .logo span { color: var(--blue); }
        .theme-btn { background: var(--hover); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; }
        
        .wrap { max-width: 420px; margin: 0 auto; padding: 30px 20px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .calc-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .visor-container { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: right; }
        #historico { font-size: 0.8rem; color: var(--muted); height: 20px; overflow-x: auto; white-space: nowrap; margin-bottom: 4px; }
        #visor { font-size: 2.2rem; font-family: monospace; color: var(--cyan); overflow-x: auto; white-space: nowrap; }

        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn { background: var(--hover); border: 1px solid var(--border); color: var(--text); font-size: 1rem; font-weight: 600; padding: 14px 0; border-radius: 12px; cursor: pointer; transition: 0.12s; user-select: none; }
        .btn:hover { border-color: var(--blue); }
        .btn:active { transform: scale(0.95); }
        
        .btn-func { color: var(--cyan); }
        .btn-op { background: rgba(59, 130, 246, 0.1); color: var(--blue); border-color: rgba(59, 130, 246, 0.2); }
        .btn-op:hover { background: rgba(59, 130, 246, 0.2); }
        .btn-clear { background: rgba(244, 63, 94, 0.1); color: var(--rose); border-color: rgba(244, 63, 94, 0.2); }
        .btn-equal { background: var(--blue); color: white; border-color: var(--blue); grid-column: span 1; font-weight: 700; }
        .btn-equal:hover { opacity: 0.9; }

        footer { background: var(--card); border-top: 1px solid var(--border); padding: 20px 0; text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: auto; }
        footer a { color: var(--muted); text-decoration: none; margin: 0 10px; }
        footer a:hover { color: var(--blue); }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="nav">
            <a href="index.html" class="logo">📦 Calcula<span>Tudo</span>Box</a>
            <button class="theme-btn" onclick="document.body.classList.toggle('light')">🌓 Tema</button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="wrap">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 4px;">Calculadora Científica</h1>
            <p style="font-size: 0.85rem; color: var(--muted);">Funciona totalmente offline direto no seu dispositivo</p>
        </div>

        <div class="calc-box">
            <!-- Visor -->
            <div class="visor-container">
                <div id="historico"></div>
                <div id="visor">0</div>
            </div>

            <!-- Teclado -->
            <div class="keypad">
                <button onclick="inserirFuncao('Math.sqrt(', '√(')" class="btn btn-func" title="Raiz Quadrada">√</button>
                <button onclick="inserirFuncao('Math.cbrt(', '∛(')" class="btn btn-func" title="Raiz Cúbica">∛</button>
                <button onclick="inserirFuncao('**2', '²')" class="btn btn-func" title="Quadrado">x²</button>
                <button onclick="inserirFuncao('**', '^')" class="btn btn-func" title="Potência">xʸ</button>

                <button onclick="inserirValor('(')" class="btn">(</button>
                <button onclick="inserirValor(')')" class="btn">)</button>
                <button onclick="inserirFuncao('Math.PI', 'π')" class="btn btn-func">π</button>
                <button onclick="inverterSinal()" class="btn">±</button>

                <button onclick="limparTudo()" class="btn btn-clear">C</button>
                <button onclick="apagarUltimo()" class="btn">⌫</button>
                <button onclick="inserirValor('%')" class="btn btn-func">%</button>
                <button onclick="inserirOperador('/', '÷')" class="btn btn-op">÷</button>

                <button onclick="inserirValor('7')" class="btn">7</button>
                <button onclick="inserirValor('8')" class="btn">8</button>
                <button onclick="inserirValor('9')" class="btn">9</button>
                <button onclick="inserirOperador('*', '×')" class="btn btn-op">×</button>

                <button onclick="inserirValor('4')" class="btn">4</button>
                <button onclick="inserirValor('5')" class="btn">5</button>
                <button onclick="inserirValor('6')" class="btn">6</button>
                <button onclick="inserirOperador('-', '-')" class="btn btn-op">-</button>

                <button onclick="inserirValor('1')" class="btn">1</button>
                <button onclick="inserirValor('2')" class="btn">2</button>
                <button onclick="inserirValor('3')" class="btn">3</button>
                <button onclick="inserirOperador('+', '+')" class="btn btn-op">+</button>

                <button onclick="inserirValor('0')" class="btn" style="grid-column: span 2;">0</button>
                <button onclick="inserirValor('.')" class="btn">.</button>
                <button onclick="calcular()" class="btn btn-equal">=</button>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 CalculaTudoBox. Todos os direitos reservados.</p>
        <div style="margin-top: 8px;">
            <a href="index.html">Início</a>
            <a href="privacidade.html">Privacidade</a>
            <a href="termos.html">Termos</a>
        </div>
    </footer>

    <!-- Lógica -->
    <script>
        const visorEl = document.getElementById('visor');
        const historicoEl = document.getElementById('historico');
        let expressaoVisual = '0';
        let expressaoReal = '0';
        let calculadoRecentemente = false;

        function atualizarVisor() {
            visorEl.innerText = expressaoVisual;
        }

        function limparTudo() {
            expressaoVisual = '0';
            expressaoReal = '0';
            historicoEl.innerText = '';
            calculadoRecentemente = false;
            atualizarVisor();
        }

        function apagarUltimo() {
            if (calculadoRecentemente) {
                limparTudo();
                return;
            }
            if (expressaoVisual.endsWith('√(') || expressaoVisual.endsWith('∛(')) {
                expressaoVisual = expressaoVisual.slice(0, -2);
                expressaoReal = expressaoReal.slice(0, -10);
            } else if (expressaoVisual.endsWith('π')) {
                expressaoVisual = expressaoVisual.slice(0, -1);
                expressaoReal = expressaoReal.slice(0, -7);
            } else if (expressaoVisual.endsWith('²')) {
                expressaoVisual = expressaoVisual.slice(0, -1);
                expressaoReal = expressaoReal.slice(0, -3);
            } else if (expressaoVisual.endsWith('^')) {
                expressaoVisual = expressaoVisual.slice(0, -1);
                expressaoReal = expressaoReal.slice(0, -2);
            } else if (expressaoVisual.length > 1) {
                expressaoVisual = expressaoVisual.slice(0, -1);
                expressaoReal = expressaoReal.slice(0, -1);
            } else {
                expressaoVisual = '0';
                expressaoReal = '0';
            }

            if (expressaoVisual === '') {
                expressaoVisual = '0';
                expressaoReal = '0';
            }
            atualizarVisor();
        }

        function inserirValor(valor) {
            if (calculadoRecentemente && !isNaN(valor)) {
                expressaoVisual = valor;
                expressaoReal = valor;
                calculadoRecentemente = false;
                atualizarVisor();
                return;
            }
            calculadoRecentemente = false;

            if (expressaoVisual === '0' && valor !== '.') {
                expressaoVisual = valor;
                expressaoReal = valor;
            } else {
                expressaoVisual += valor;
                expressaoReal += valor;
            }
            atualizarVisor();
        }

        function inserirOperador(opReal, opVisual) {
            calculadoRecentemente = false;
            expressaoVisual += opVisual;
            expressaoReal += opReal;
            atualizarVisor();
        }

        function inserirFuncao(funcReal, funcVisual) {
            if (funcVisual === '√(' || funcVisual === '∛(' || funcVisual === 'π') {
                if (expressaoVisual === '0' || calculadoRecentemente) {
                    expressaoVisual = funcVisual;
                    expressaoReal = funcReal;
                } else {
                    const ultimoChar = expressaoVisual.slice(-1);
                    if (!isNaN(ultimoChar) || ultimoChar === ')' || ultimoChar === 'π' || ultimoChar === '²') {
                        expressaoVisual += '×' + funcVisual;
                        expressaoReal += '*' + funcReal;
                    } else {
                        expressaoVisual += funcVisual;
                        expressaoReal += funcReal;
                    }
                }
            } else {
                expressaoVisual += funcVisual;
                expressaoReal += funcReal;
            }
            calculadoRecentemente = false;
            atualizarVisor();
        }

        function inverterSinal() {
            if (expressaoVisual === '0') return;
            if (expressaoVisual.startsWith('-')) {
                expressaoVisual = expressaoVisual.slice(1);
                expressaoReal = expressaoReal.slice(1);
            } else {
                expressaoVisual = '-' + expressaoVisual;
                expressaoReal = '-' + expressaoReal;
            }
            atualizarVisor();
        }

        function calcular() {
            try {
                let codigoParaCalculo = expressaoReal
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/%/g, '/100');

                const abre = (codigoParaCalculo.match(/\(/g) || []).length;
                const fecha = (codigoParaCalculo.match(/\)/g) || []).length;
                const faltando = abre - fecha;
                
                let sufixoVisual = '';
                for (let i = 0; i < faltando; i++) {
                    codigoParaCalculo += ')';
                    sufixoVisual += ')';
                }

                let resultado = eval(codigoParaCalculo);

                if (!isFinite(resultado) || isNaN(resultado)) {
                    throw new Error('Inválido');
                }

                if (!Number.isInteger(resultado)) {
                    resultado = Number(resultado.toFixed(8));
                }

                historicoEl.innerText = expressaoVisual + sufixoVisual + ' =';
                expressaoVisual = String(resultado);
                expressaoReal = String(resultado);
                calculadoRecentemente = true;
                atualizarVisor();
            } catch (error) {
                visorEl.innerText = 'Erro';
                expressaoVisual = '0';
                expressaoReal = '0';
                calculadoRecentemente = false;
            }
         }

        // Teclado físico
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inserirValor(e.key);
            else if (e.key === '.') inserirValor('.');
            else if (e.key === '+') inserirOperador('+', '+');
            else if (e.key === '-') inserirOperador('-', '-');
            else if (e.key === '*') inserirOperador('*', '×');
            else if (e.key === '/') { e.preventDefault(); inserirOperador('/', '÷'); }
            else if (e.key === '(' || e.key === ')') inserirValor(e.key);
            else if (e.key === '^') inserirFuncao('**', '^');
            else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calcular(); }
            else if (e.key === 'Backspace') apagarUltimo();
            else if (e.key === 'Escape') limparTudo();
        });
    </script>
</body>
</html>
