<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica - Calcula Tudo Box</title>
    
    <!-- Configurações de PWA e Tema -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker registrado com sucesso!'))
          .catch((err) => console.log('Erro ao registrar Service Worker:', err));
      }
    </script>

    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-calc {
            transition: all 0.15s ease;
        }
        .btn-calc:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Cabeçalho -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-wider text-cyan-400 hover:text-cyan-300 transition-colors">
                Calcula Tudo Box
            </a>
            <nav class="space-x-4 text-sm text-slate-400">
                <a href="index.html" class="hover:text-slate-100 transition-colors">Início</a>
                <a href="sobre.html" class="hover:text-slate-100 transition-colors">Sobre</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-md w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Calculadora Rápida</h1>
            <p class="text-xs text-slate-400 mt-1">Ferramenta essencial para o dia a dia</p>
        </div>

        <!-- Visor da Calculadora -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-4">
            <div id="historico" class="text-right text-xs text-slate-500 h-6 overflow-x-auto whitespace-nowrap mb-1"></div>
            <div id="visor" class="text-right text-3xl sm:text-4xl font-mono text-cyan-400 overflow-x-auto whitespace-nowrap tracking-wider">0</div>
        </div>

        <!-- Teclado da Calculadora -->
        <div class="grid grid-cols-4 gap-2 bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl shadow-xl">
            <!-- Linha 1 -->
            <button onclick="limparTudo()" class="btn-calc bg-rose-950/60 hover:bg-rose-900/60 text-rose-300 font-semibold py-3 rounded-xl border border-rose-900/40">C</button>
            <button onclick="apagarUltimo()" class="btn-calc bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl border border-slate-700/50">⌫</button>
            <button onclick="inserirValor('%')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-cyan-400 font-semibold py-3 rounded-xl border border-slate-700/50">%</button>
            <button onclick="inserirValor('/')" class="btn-calc bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 font-semibold py-3 rounded-xl border border-cyan-900/40">÷</button>

            <!-- Linha 2 -->
            <button onclick="inserirValor('7')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">7</button>
            <button onclick="inserirValor('8')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">8</button>
            <button onclick="inserirValor('9')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">9</button>
            <button onclick="inserirValor('*')" class="btn-calc bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 font-semibold py-3 rounded-xl border border-cyan-900/40">×</button>

            <!-- Linha 3 -->
            <button onclick="inserirValor('4')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">4</button>
            <button onclick="inserirValor('5')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">5</button>
            <button onclick="inserirValor('6')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">6</button>
            <button onclick="inserirValor('-')" class="btn-calc bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 font-semibold py-3 rounded-xl border border-cyan-900/40">-</button>

            <!-- Linha 4 -->
            <button onclick="inserirValor('1')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">1</button>
            <button onclick="inserirValor('2')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">2</button>
            <button onclick="inserirValor('3')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">3</button>
            <button onclick="inserirValor('+')" class="btn-calc bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 font-semibold py-3 rounded-xl border border-cyan-900/40">+</button>

            <!-- Linha 5 -->
            <button onclick="inserirValor('0')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800 col-span-2">0</button>
            <button onclick="inserirValor('.')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">.</button>
            <button onclick="calcular()" class="btn-calc bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-cyan-950">=</button>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Calcula Tudo Box. Todos os direitos reservados.</p>
        <div class="mt-2 space-x-3">
            <a href="privacidade.html" class="hover:text-slate-400">Privacidade</a>
            <span>•</span>
            <a href="termos.html" class="hover:text-slate-400">Termos</a>
            <span>•</span>
            <a href="contato.html" class="hover:text-slate-400">Contato</a>
        </div>
    </footer>

    <!-- Lógica da Calculadora -->
    <script>
        let visorEl = document.getElementById('visor');
        let historicoEl = document.getElementById('historico');
        let expressaoAtual = '0';

        function atualizarVisor() {
            visorEl.innerText = expressaoAtual;
        }

        function limparTudo() {
            expressaoAtual = '0';
            historicoEl.innerText = '';
            atualizarVisor();
        }

        function apagarUltimo() {
            if (expressaoAtual.length > 1) {
                expressaoAtual = expressaoAtual.slice(0, -1);
            } else {
                expressaoAtual = '0';
            }
            atualizarVisor();
        }

        function inserirValor(valor) {
            if (expressaoAtual === '0' && valor !== '.') {
                expressaoAtual = valor;
            } else {
                expressaoAtual += valor;
            }
            atualizarVisor();
        }

        function calcular() {
            try {
                // Substitui visualmente para cálculo seguro
                let expressaoParaCalculo = expressaoAtual
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');
                
                // Tratamento básico para porcentagem
                expressaoParaCalculo = expressaoParaCalculo.replace(/%/g, '/100');

                let resultado = eval(expressaoParaCalculo);
                
                historicoEl.innerText = expressaoAtual + ' =';
                expressaoAtual = String(resultado);
                atualizarVisor();
            } catch (error) {
                visorEl.innerText = 'Erro';
                expressaoAtual = '0';
            }
        }
    </script>
</body>
</html>
