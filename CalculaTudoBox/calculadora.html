<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica & Básica - Calcula Tudo Box</title>
    
    <!-- Configurações de PWA e Tema -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker registrado com sucesso!'))
          .catch((err) => console.log('Erro ao registrar Service Worker:', err));
      }
    </script>

    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-calc {
            transition: all 0.15s ease;
        }
        .btn-calc:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Cabeçalho -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-wider text-cyan-400 hover:text-cyan-300 transition-colors">
                Calcula Tudo Box
            </a>
            <nav class="space-x-4 text-sm text-slate-400">
                <a href="index.html" class="hover:text-slate-100 transition-colors">Início</a>
                <a href="sobre.html" class="hover:text-slate-100 transition-colors">Sobre</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-md w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Calculadora Científica</h1>
            <p class="text-xs text-slate-400 mt-1">Operações básicas e funções avançadas para o dia a dia</p>
        </div>

        <!-- Visor da Calculadora -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-4">
            <div id="historico" class="text-right text-xs text-slate-500 h-6 overflow-x-auto whitespace-nowrap mb-1"></div>
            <div id="visor" class="text-right text-3xl sm:text-4xl font-mono text-cyan-400 overflow-x-auto whitespace-nowrap tracking-wider">0</div>
        </div>

        <!-- Teclado da Calculadora -->
        <div class="grid grid-cols-4 gap-2 bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl shadow-xl">
            <!-- Linha Científica / Extra 1 -->
            <button onclick="inserirValor('(')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl border border-slate-700/50">(</button>
            <button onclick="inserirValor(')')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl border border-slate-700/50">)</button>
            <button onclick="inserirFuncao('Math.sqrt(', '√')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-cyan-400 font-semibold py-3 rounded-xl border border-slate-700/50">√</button>
            <button onclick="inserirFuncao('**2', '²')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-cyan-400 font-semibold py-3 rounded-xl border border-slate-700/50">x²</button>

            <!-- Linha Limpeza e Operadores -->
            <button onclick="limparTudo()" class="btn-calc bg-rose-950/60 hover:bg-rose-900/60 text-rose-300 font-semibold py-3 rounded-xl border border-rose-900/40">C</button>
            <button onclick="apagarUltimo()" class="btn-calc bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl border border-slate-700/50">⌫</button>
            <button onclick="inserirValor('%')" class="btn-calc bg-slate-800 hover:bg-slate-700 text-cyan-400 font-semibold py-3 rounded-xl border border-slate-700/50">%</button>
            <button onclick="inserirValor('/')" class="btn-calc bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 font-semibold py-3 rounded-xl border border-cyan-900/40">÷</button>

            <!-- Números 7, 8, 9 e Multiplicação -->
            <button onclick="inserirValor('7')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">7</button>
            <button onclick="inserirValor('8')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">8</button>
            <button onclick="inserirValor('9')" class="btn-calc bg-slate-900 hover:bg-slate-800 text-slate-200 py-3 rounded-xl border border-slate-800">9</button>
            <button onclick="inserirValor('*')" class="btn-calc bg-cyan-950/60 hover:bg-
